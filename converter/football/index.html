<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CineArena | Live Sports Streaming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: #0b0d14;
            color: #f1f5f9;
            padding: 20px 24px 40px 24px;
        }

        .app-wrapper {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* header */
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 1px solid #262a36;
            padding-bottom: 16px;
            margin-bottom: 28px;
        }
        .logo h1 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(120deg, #f0f9ff, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .live-badge {
            background: #dc262630;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fca5a5;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .live-dot-pulse {
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8);}
            100% { opacity: 1; transform: scale(1.2);}
        }

        /* hero live banner */
        .hero-live {
            background: linear-gradient(135deg, #0f172f, #0a0f1e);
            border-radius: 32px;
            padding: 18px 28px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            border: 1px solid #2d3348;
        }
        .hero-text h2 {
            font-size: 1.8rem;
            font-weight: 700;
        }
        .hero-text p {
            color: #94a3b8;
        }
        .watch-cta {
            background: #2563eb;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: bold;
        }

        /* categories scroll */
        .categories-row {
            overflow-x: auto;
            white-space: nowrap;
            margin-bottom: 28px;
            scrollbar-width: thin;
            padding-bottom: 6px;
        }
        .cat-list {
            display: inline-flex;
            gap: 12px;
        }
        .cat-btn {
            background: #181c2a;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #cbd5e1;
            transition: 0.2s;
            cursor: pointer;
        }
        .cat-btn.active {
            background: #2c7be5;
            color: white;
            box-shadow: 0 6px 14px rgba(44,123,229,0.3);
        }
        .cat-btn:hover {
            background: #2d374f;
        }

        /* matches grid */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 24px;
            margin-top: 8px;
        }
        .match-card {
            background: #11141f;
            border-radius: 28px;
            border: 1px solid #252b3d;
            overflow: hidden;
            transition: all 0.2s;
        }
        .match-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: #0c0f19;
            border-bottom: 1px solid #202433;
        }
        .league-name {
            font-weight: 700;
            font-size: 0.75rem;
            background: #1e2a3e;
            padding: 4px 12px;
            border-radius: 24px;
            letter-spacing: 0.4px;
        }
        .live-tag {
            background: #b91c1c40;
            color: #ff8a8a;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .teams-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px 12px 24px;
            gap: 16px;
            flex-wrap: wrap;
        }
        .team-block {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .team-name {
            font-weight: 800;
            font-size: 1.3rem;
        }
        .vs-div {
            color: #5b6e8c;
            font-weight: 700;
        }
        .match-meta {
            padding: 0 24px 8px 24px;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #94a3b8;
            flex-wrap: wrap;
        }
        .countdown-timer {
            font-family: monospace;
            background: #01010130;
            padding: 2px 8px;
            border-radius: 32px;
            font-weight: bold;
            color: #e2e8f0;
        }
        .stream-btns {
            padding: 12px 20px 20px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            border-top: 1px solid #202433;
            margin-top: 6px;
        }
        .stream-btn {
            background: #1e2538;
            border: none;
            color: #f0f4fe;
            padding: 8px 16px;
            border-radius: 36px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .stream-btn.adfree {
            border-left: 3px solid #10b981;
            background: #16212b;
        }
        .stream-btn:hover {
            background: #2d3a58;
            transform: translateY(-2px);
        }

        /* sidebar column (right) */
        .info-sidebar {
            margin-top: 32px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 28px;
            align-items: start;
        }
        .upcoming-panel {
            background: #11141f;
            border-radius: 28px;
            padding: 20px;
            border: 1px solid #252b3d;
        }
        .upcoming-panel h3 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mini-match {
            background: #0c0f1a;
            margin-bottom: 14px;
            border-radius: 20px;
            padding: 12px 14px;
            border-left: 3px solid #3b82f6;
        }
        .mini-league {
            font-size: 0.7rem;
            color: #8ba0ca;
        }
        .mini-teams {
            font-weight: 700;
            margin: 6px 0;
        }

        /* popup modal */
        .modal-stream {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s ease;
        }
        .modal-stream.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-box {
            background: #0c0f1a;
            width: 92%;
            max-width: 1000px;
            border-radius: 36px;
            overflow: hidden;
            border: 1px solid #334155;
            box-shadow: 0 30px 50px rgba(0,0,0,0.6);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            background: #0b0e16;
            border-bottom: 1px solid #262d40;
        }
        .modal-header h3 {
            font-weight: 700;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 32px;
            color: #cbd5e1;
            cursor: pointer;
            line-height: 1;
        }
        .iframe-container {
            background: #000000;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        iframe {
            width: 100%;
            height: 65vh;
            min-height: 450px;
            border: none;
            background: black;
        }
        .stream-footer {
            padding: 14px 24px;
            background: #0a0d16;
            font-size: 0.8rem;
            color: #9aa9c1;
        }
        @media (max-width: 760px) {
            .info-sidebar { grid-template-columns: 1fr; }
            .matches-grid { grid-template-columns: 1fr; }
            .team-name { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="header-flex">
        <div class="logo">
            <h1>⚡ CineArena </h1>
        </div>
        <div class="live-badge">
            <span class="live-dot-pulse"></span> 1Live · LiveFootballStreams
        </div>
    </div>

    <!-- Hero banner exactly as screenshot -->
    <div class="hero-live">
        <div class="hero-text">
            <h2>Watch every match in real-time</h2>
            <p>Live streams · MPD & HLS · Ad-free quality</p>
        </div>
        <div class="watch-cta">🔴 LIVE NOW</div>
    </div>

    <!-- Categories (dynamic) -->
    <div class="categories-row" id="categoriesContainer">
        <div class="cat-list"></div>
    </div>

    <!-- main matches grid -->
    <div id="matchesGrid" class="matches-grid"></div>

    
    </div>
</div>

<!-- MODAL POPUP PLAYER (with url wrapper: MPD & HLS) -->
<div id="streamModal" class="modal-stream">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modalStreamTitle">FootyFeed Live Stream</h3>
            <button class="close-modal" id="closeModalBtn">&times;</button>
        </div>
        <div class="iframe-container">
            <iframe id="streamIframe" src="about:blank" allowfullscreen></iframe>
        </div>
        <div class="stream-footer" id="streamFooterMsg">
            🎬 Stream loaded from external source • MPD/HLS wrapped
        </div>
    </div>
</div>

<script>
    // ------------------------------
    // exact JSON structure (internal but we also support external fetch)
    // we'll fetch from external JSON file (matches.json) exactly as format shown.
    // The user can host a JSON file with same schema.
    // For demo, we define a rich dataset that matches screenshot: CRICKET (BAN vs PAK) , IPL (CSK vs LSG), SERIE A (Verona vs Como)
    // and categories: EPL, Eredivisie, F1, Indian Premier League, LaLiga2, etc.
    // the player uses: for MPD => https://cinearena.fun/plyr/p1/?url= + encodedStreamUrl
    // for HLS => https://cinearena.fun/ios/?url= + encodedStreamUrl
    // -------------------------------------------------
    
    let allMatches = [];
    let currentCategory = "All";
    
    // Helper to build the stream proxy URL
    function getStreamProxyUrl(streamSourceUrl, streamType) {
        // streamType can be "mpd", "hls", "mp4", "m3u8"
        const typeLower = (streamType || "").toLowerCase();
        if (typeLower === "mpd" || streamSourceUrl.includes('.mpd')) {
            return `https://cinearena.fun/plyr/p1/?url=${encodeURIComponent(streamSourceUrl)}`;
        } else if (typeLower === "hls" || typeLower === "m3u8" || streamSourceUrl.includes('.m3u8')) {
            return `https://cinearena.fun/ios/?url=${encodeURIComponent(streamSourceUrl)}`;
        } else {
            // fallback for generic video, treat as hls-compatible or direct mp4
            return `https://cinearena.fun/ios/?url=${encodeURIComponent(streamSourceUrl)}`;
        }
    }
    
    // function to open modal with specific stream
    function openStreamModal(match, streamItem) {
        const modal = document.getElementById("streamModal");
        const iframe = document.getElementById("streamIframe");
        const modalTitle = document.getElementById("modalStreamTitle");
        const footerMsg = document.getElementById("streamFooterMsg");
        
        let rawUrl = streamItem.sourceUrl;
        if (!rawUrl) {
            // fallback demo url
            rawUrl = streamItem.type === "mpd" ? "https://demo.cinearena.fun/sample.mpd" : "https://demo.cinearena.fun/sample.m3u8";
        }
        const streamType = streamItem.type || (rawUrl.includes('.mpd') ? 'mpd' : 'hls');
        const finalProxyUrl = getStreamProxyUrl(rawUrl, streamType);
        
        modalTitle.innerText = `${match.team1} vs ${match.team2} • ${streamItem.name}`;
        iframe.src = finalProxyUrl;
        footerMsg.innerHTML = `🔗 Stream: ${streamItem.name} (${streamType.toUpperCase()}) wrapped via proxy • source: ${rawUrl.substring(0, 70)}${rawUrl.length > 70 ? '...' : ''}`;
        modal.classList.add("active");
    }
    
    function closeModal() {
        const modal = document.getElementById("streamModal");
        const iframe = document.getElementById("streamIframe");
        if (modal) modal.classList.remove("active");
        if (iframe) iframe.src = "about:blank";
    }
    
    // render matches grid
    function renderMatches(matches) {
        const container = document.getElementById("matchesGrid");
        if (!container) return;
        let filtered = currentCategory === "All" ? matches : matches.filter(m => m.category === currentCategory);
        if (filtered.length === 0) {
            container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px;">⚠️ No matches found for "${currentCategory}"</div>`;
            return;
        }
        container.innerHTML = filtered.map(match => {
            const isLive = match.live === true;
            const countdownDisplay = match.countdown ? match.countdown : (match.time ? `${match.time}` : "Soon");
            return `
                <div class="match-card">
                    <div class="match-top">
                        <span class="league-name">${match.league}</span>
                        ${isLive ? '<span class="live-tag">🔴 LIVE</span>' : '<span class="live-tag">UPCOMING</span>'}
                    </div>
                    <div class="teams-row">
                        <div class="team-block"><span class="team-name">${match.team1}</span></div>
                        <div class="vs-div">VS</div>
                        <div class="team-block"><span class="team-name">${match.team2}</span></div>
                    </div>
                    <div class="match-meta">
                        <span>📅 ${match.date || "10 May"} • ${match.time || "TBD"}</span>
                        <span class="countdown-timer">⏱️ ${countdownDisplay}</span>
                    </div>
                    <div class="stream-btns" data-match-id="${match.id}">
                        ${match.streams.map((stream, idx) => `
                            <button class="stream-btn ${stream.adfree ? 'adfree' : ''}" data-stream-index="${idx}" data-match-json='${JSON.stringify(match).replace(/'/g, "&#39;")}' data-stream-name="${stream.name.replace(/['"]/g, '')}">
                                ${stream.adfree ? '✨' : '📺'} ${stream.name}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
        
        // attach event listeners for all stream buttons (dynamic)
        document.querySelectorAll('.stream-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const matchJsonStr = btn.getAttribute('data-match-json');
                if (!matchJsonStr) return;
                const matchObj = JSON.parse(matchJsonStr);
                const streamIdx = parseInt(btn.getAttribute('data-stream-index'));
                const selectedStream = matchObj.streams[streamIdx];
                if (selectedStream) {
                    openStreamModal(matchObj, selectedStream);
                } else {
                    alert("Stream info missing");
                }
            });
        });
    }
    
    // render upcoming sidebar
    function renderUpcomingSidebar(matches) {
        const upcomingDiv = document.getElementById("upcomingList");
        if (!upcomingDiv) return;
        const upcomingMatches = matches.filter(m => !m.live).slice(0, 4);
        if (upcomingMatches.length === 0) {
            upcomingDiv.innerHTML = `<div class="mini-match">All matches LIVE! ⚡</div>`;
            return;
        }
        upcomingDiv.innerHTML = upcomingMatches.map(m => `
            <div class="mini-match">
                <div class="mini-league">${m.league}</div>
                <div class="mini-teams">${m.team1} 🆚 ${m.team2}</div>
                <div style="font-size:0.7rem; margin-top: 6px;">⏰ ${m.time} • ${m.countdown || m.date || "Today"}</div>
            </div>
        `).join('');
    }
    
    // render category pills + highlight
    function renderCategories(categoriesArray) {
        const container = document.querySelector(".cat-list");
        if (!container) return;
        container.innerHTML = categoriesArray.map(cat => `
            <button class="cat-btn ${currentCategory === cat ? 'active' : ''}" data-category="${cat}">${cat}</button>
        `).join('');
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentCategory = btn.getAttribute('data-category');
                renderCategories(categoriesArray);
                renderMatches(allMatches);
                // category change doesn't affect upcoming sidebar but fine
            });
        });
    }
    
    // Load data from external json (matches.json or any endpoint)
    async function loadMatchesFromJson() {
        try {
            // FIRST: attempt to fetch from external "matches.json" (user-provided)
            // If file not exists, we fallback to the predefined dataset that matches exactly screenshot format 
            const response = await fetch('https://cinearena.fun/api/allinone.json');
            if (!response.ok) throw new Error('external json not found, using default dataset');
            const data = await response.json();
            // support { matches: [...] } or direct array
            if (data.matches && Array.isArray(data.matches)) return data.matches;
            if (Array.isArray(data)) return data;
            return [];
        } catch (err) {
            console.warn("using fallback internal dataset (exact screenshot style)", err);
            // this dataset mirrors the screenshot: BAN vs PAK (Cricket), CSK vs LSG (IPL), Verona vs Como (Serie A IT)
            // and categories exactly as shown: Indian Premier League, Cricket, Serie A IT, LaLiga, EPL etc
            return [
                { id:1, league:"Cricket", category:"Cricket", team1:"BAN", team2:"PAK", date:"10 May", time:"09:30 am IST", live:true, countdown:"LIVE", streams:[{name:"WILLOW [Ad-Free] (MPD)", type:"mpd", sourceUrl:"https://stream.example/cricket/willow.mpd", adfree:true},{name:"PREMIER SPORTS (MPD)", type:"mpd", sourceUrl:"https://stream.example/cricket/premier.mpd"},{name:"FANCODE FHD (MPD)", type:"mpd", sourceUrl:"https://stream.example/cricket/fancode-fhd.mpd"},{name:"Willow HD (MPD)", type:"mpd", sourceUrl:"https://stream.example/cricket/willowhd.mpd"},{name:"FANCODE - SD (MPD)", type:"mpd", sourceUrl:"https://stream.example/cricket/fancode-sd.mpd"}] },
                { id:2, league:"Indian Premier League", category:"Indian Premier League", team1:"CSK", team2:"LSG", date:"10 May", time:"03:30 pm IST", live:false, countdown:"MATCH STARTS IN 01 HRS 27 MIN", streams:[{name:"Star Sports HD (MPD)", type:"mpd", sourceUrl:"https://stream.example/ipl/starsports.mpd"},{name:"JioCinema (MPD)", type:"mpd", sourceUrl:"https://stream.example/ipl/jiocinema.mpd"}] },
                { id:3, league:"Serie A IT", category:"Serie A IT", team1:"Verona", team2:"Como", date:"10 May", time:"04:00 pm IST", live:false, countdown:"MATCH STARTS IN 01 HRS 57 MIN", streams:[{name:"DAZN IT (MPD)", type:"mpd", sourceUrl:"https://stream.example/seriea/dazn.mpd"},{name:"Sky Sport (HLS)", type:"hls", sourceUrl:"https://stream.example/seriea/sky.m3u8"}] },
                { id:4, league:"EPL", category:"EPL", team1:"Arsenal", team2:"Chelsea", date:"10 May", time:"17:30 BST", live:false, countdown:"02 HRS 10 MIN", streams:[{name:"NBC Sports (HLS)", type:"hls", sourceUrl:"https://stream.example/epl/nbc.m3u8"},{name:"Optus Sport (MPD)", type:"mpd", sourceUrl:"https://stream.example/epl/optus.mpd"}] },
                { id:5, league:"LaLiga es", category:"LaLiga es", team1:"Barcelona", team2:"Atletico", date:"10 May", time:"21:00 CEST", live:false, countdown:"04 HRS 20 MIN", streams:[{name:"ESPN+ (HLS)", type:"hls", sourceUrl:"https://stream.example/laliga/espn.m3u8", adfree:true},{name:"LaLiga TV (MPD)", type:"mpd", sourceUrl:"https://stream.example/laliga/laligatv.mpd"}] },
                { id:6, league:"Scottish Premiership", category:"Scottish Premiership", team1:"Celtic", team2:"Rangers", date:"10 May", time:"15:00 BST", live:false, countdown:"STARTS IN 00 HRS 45 MIN", streams:[{name:"Sky Sports (HLS)", type:"hls", sourceUrl:"https://stream.example/scottish/sky.m3u8"}] },
                { id:7, league:"League Two", category:"League Two", team1:"Bradford", team2:"Stockport", date:"10 May", time:"15:00 BST", live:false, countdown:"02 HRS", streams:[{name:"iFollow (MPD)", type:"mpd", sourceUrl:"https://stream.example/league2/ifollow.mpd"}] },
                { id:8, league:"F1", category:"F1", team1:"Verstappen", team2:"Hamilton", date:"10 May", time:"15:00 CEST", live:true, countdown:"RACE LIVE", streams:[{name:"F1 TV Pro (HLS)", type:"hls", sourceUrl:"https://stream.example/f1/f1tv.m3u8", adfree:true},{name:"Sky Sports F1 (MPD)", type:"mpd", sourceUrl:"https://stream.example/f1/skyf1.mpd"}] },
                { id:9, league:"Pro League sa", category:"Pro League sa", team1:"Al Hilal", team2:"Al Nassr", date:"10 May", time:"19:00 AST", live:false, countdown:"03 HRS", streams:[{name:"SSC HD (MPD)", type:"mpd", sourceUrl:"https://stream.example/saudi/ssc.mpd"}] },
                { id:10, league:"Eredivisie", category:"Eredivisie", team1:"Ajax", team2:"Feyenoord", date:"10 May", time:"14:30 CET", live:false, countdown:"01 HRS", streams:[{name:"ESPN NL (HLS)", type:"hls", sourceUrl:"https://stream.example/eredivisie/espn.m3u8"}] },
                { id:11, league:"LaLiga 2", category:"LaLiga 2", team1:"Zaragoza", team2:"Sporting", date:"10 May", time:"18:30 CEST", live:false, countdown:"MATCH STARTS IN 02 HRS", streams:[{name:"LaLiga+ (MPD)", type:"mpd", sourceUrl:"https://stream.example/laliga2/plus.mpd"}] }
            ];
        }
    }
    
    // init categories from matches
    function buildCategoryList(matches) {
        const cats = new Set(matches.map(m => m.category).filter(Boolean));
        const sorted = Array.from(cats).sort((a,b)=>a.localeCompare(b));
        return ["All", ...sorted];
    }
    
    // update UI with fresh data
    async function initDashboard() {
        const matchesArray = await loadMatchesFromJson();
        allMatches = matchesArray;
        if (!allMatches.length) allMatches = [];
        const categories = buildCategoryList(allMatches);
        renderCategories(categories);
        renderMatches(allMatches);
        renderUpcomingSidebar(allMatches);
        // attach close modal
        document.getElementById("closeModalBtn")?.addEventListener("click", closeModal);
        window.addEventListener("click", (e) => {
            const modal = document.getElementById("streamModal");
            if (e.target === modal) closeModal();
        });
    }
    
    initDashboard();
</script>
</body>
</html>
