<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cine Arena - Channel Player</title>
    <link rel="shortcut icon" type="image/x-icon" href="https://cinearena.github.io/astro-jwplyr/faviconimg.jpeg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: #000;
        }

        .header {
            background: rgba(0,0,0,0.95);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            height: 36px;
            cursor: pointer;
        }

        .logo span {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #ff0000);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .channel-info {
            background: rgba(255,0,0,0.15);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            border-left: 2px solid #ff0000;
        }

        .player-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        .shaka-video-container {
            width: 100%;
            height: 100%;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 12px 24px;
            border-radius: 40px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 200;
            border: 1px solid #ff0000;
            font-size: 0.85rem;
            font-weight: 500;
            color: white;
        }

        .loader.active {
            display: flex;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #ff0000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .manual-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 14px 32px;
            border-radius: 50px;
            z-index: 300;
            border: 2px solid #ff0000;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            color: white;
            transition: 0.2s;
        }

        .manual-play:hover {
            background: #ff0000;
            transform: translate(-50%, -50%) scale(1.02);
        }

        .error-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 20px 30px;
            border-radius: 16px;
            text-align: center;
            z-index: 250;
            border: 1px solid #ff3333;
            display: none;
            max-width: 80%;
        }

        .error-box h3 {
            color: #ff6666;
            margin-bottom: 8px;
        }

        .error-box p {
            font-size: 0.85rem;
            color: #ccc;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff0000dd;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            z-index: 400;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .logo span { font-size: 1rem; }
            .channel-info { font-size: 0.65rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">
            <img src="https://cineplyr.pages.dev/assests/newlogo.png" alt="logo" onclick="window.open('https://t.me/cine_arena', '_blank')">
            <span></span>
        </div>
        <div class="channel-info" id="channelBadge">LOADING...</div>
    </div>
    <div class="player-container">
        <div class="shaka-video-container" id="videoContainer">
            <video id="video" autoplay muted playsinline preload="auto"></video>
        </div>
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <span>BUFFERING...</span>
        </div>
        <div class="manual-play" id="manualPlay">▶ CLICK TO PLAY</div>
        <div class="error-box" id="errorBox">
            <h3>⚠️ ERROR</h3>
            <p id="errorMsg">Playback failed</p>
        </div>
        <div class="toast" id="toast">Message</div>
    </div>
</div>

<script>
    const CHANNELS_URL = "https://cinearena.fun/api/zee5.json";
    const urlId = new URLSearchParams(window.location.search).get('id');
    
    let player = null;
    let ui = null;
    let video = null;
    let container = null;
    
    const loader = document.getElementById('loader');
    const manualBtn = document.getElementById('manualPlay');
    const errorBox = document.getElementById('errorBox');
    const errorMsg = document.getElementById('errorMsg');
    const badge = document.getElementById('channelBadge');
    const toast = document.getElementById('toast');
    
    function showToast(msg, duration = 3000) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), duration);
    }
    
    function showLoader(show) {
        if (show) loader.classList.add('active');
        else loader.classList.remove('active');
    }
    
    function showError(msg) {
        errorMsg.textContent = msg;
        errorBox.style.display = 'block';
        setTimeout(() => { errorBox.style.display = 'none'; }, 6000);
    }
    
    function hideError() {
        errorBox.style.display = 'none';
    }
    
    function forceControlsVisible() {
        if (!container) return;
        const controls = container.querySelector('.shaka-controls-container');
        if (controls) {
            controls.style.opacity = '1';
            controls.style.visibility = 'visible';
            controls.setAttribute('shown', 'true');
        }
        const bottom = container.querySelector('.shaka-bottom-controls');
        if (bottom) {
            bottom.style.opacity = '1';
            bottom.style.visibility = 'visible';
        }
    }
    
    async function initPlayer() {
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
            throw new Error('Browser not supported');
        }
        
        video = document.getElementById('video');
        container = document.getElementById('videoContainer');
        player = new shaka.Player(video);
        await player.attach(video);
        
        ui = new shaka.ui.Overlay(player, container, video);
        ui.configure({
            controlPanelElements: [
                'play_pause', 'time_and_duration', 'mute', 'volume', 'spacer',
                'captions', 'quality', 'fullscreen', 'overflow_menu'
            ],
            enableFullscreenOnRotation: true
        });
        
        if (ui.controls) {
            if (typeof ui.controls.setFadeTimeout === 'function') {
                ui.controls.setFadeTimeout = () => {};
            }
            if (ui.controls.hide) {
                ui.controls.hide = function() { return; };
            }
            if (typeof ui.controls.show === 'function') {
                ui.controls.show();
            }
            if (ui.controls.fadeDelayMs !== undefined) {
                ui.controls.fadeDelayMs = 999999999;
            }
        }
        
        const style = document.createElement('style');
        style.textContent = `
            .shaka-controls-container {
                opacity: 1 !important;
                visibility: visible !important;
                transition: none !important;
            }
            .shaka-controls-container[shown="false"] {
                opacity: 1 !important;
                visibility: visible !important;
            }
            .shaka-bottom-controls {
                opacity: 1 !important;
                visibility: visible !important;
            }
        `;
        document.head.appendChild(style);
        
        setInterval(() => forceControlsVisible(), 500);
        container.addEventListener('mousemove', () => forceControlsVisible());
        container.addEventListener('touchstart', () => forceControlsVisible());
        
        player.addEventListener('error', (e) => {
            const err = e.detail;
            showError(err.message || 'Playback error');
            showLoader(false);
        });
        
        video.addEventListener('play', () => {
            manualBtn.style.display = 'none';
            hideError();
            forceControlsVisible();
        });
        
        return true;
    }
    
    async function loadChannelById(channelId) {
        if (!channelId) {
            badge.innerHTML = '❌ NO ID';
            showError('Missing ?id= parameter in URL');
            showLoader(false);
            return false;
        }
        
        showLoader(true);
        badge.innerHTML = `🔍 ${channelId}`;
        
        try {
            const res = await fetch(CHANNELS_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}: Cannot load channels.json`);
            
            const channels = await res.json();
            if (!Array.isArray(channels) || channels.length === 0) {
                throw new Error('Invalid channels data');
            }
            
            const channel = channels.find(c => c.id === channelId);
            if (!channel) {
                const ids = channels.map(c => c.id).slice(0, 5).join(', ');
                throw new Error(`ID "${channelId}" not found. Available: ${ids}...`);
            }
            
            badge.innerHTML = `🎬 ${channel.title}`;
            
            const drmConfig = {
                clearKeys: {
                    [channel.keyId]: channel.key
                }
            };
            
            player.configure({
                drm: drmConfig,
                streaming: {
                    lowLatencyMode: true,
                    bufferingGoal: 15,
                    rebufferingGoal: 2,
                    retryParameters: {
                        timeout: 10000,
                        maxAttempts: 4,
                        baseDelay: 300
                    }
                }
            });
            
            player.getNetworkingEngine().registerRequestFilter((type, req) => {
                req.headers['User-Agent'] = 'Mozilla/5.0';
                req.headers['Referer'] = 'https://www.jiotv.com/';
            });
            
            await player.load(channel.url);
            showToast(`Now playing: ${channel.title}`);
            hideError();
            forceControlsVisible();
            
            try {
                await video.play();
                const unmute = () => {
                    if (video.muted) {
                        video.muted = false;
                        showToast('🔊 Sound enabled', 1500);
                    }
                    document.removeEventListener('click', unmute);
                    document.removeEventListener('touchstart', unmute);
                };
                document.addEventListener('click', unmute, { once: true });
                document.addEventListener('touchstart', unmute, { once: true });
            } catch (autoplayErr) {
                manualBtn.style.display = 'flex';
                const playHandler = async () => {
                    try {
                        await video.play();
                        manualBtn.style.display = 'none';
                        if (video.muted) {
                            video.muted = false;
                            showToast('🔊 Sound enabled', 1500);
                        }
                        forceControlsVisible();
                    } catch (e) {
                        showToast('Click again to play', 1500);
                    }
                    manualBtn.removeEventListener('click', playHandler);
                };
                manualBtn.addEventListener('click', playHandler, { once: true });
            }
            
            showLoader(false);
            return true;
            
        } catch (err) {
            console.error(err);
            showError(err.message);
            badge.innerHTML = '⚠️ ERROR';
            showLoader(false);
            return false;
        }
    }
    
    async function bootstrap() {
        try {
            await initPlayer();
            forceControlsVisible();
        } catch (err) {
            showError('Player init failed: ' + err.message);
            return;
        }
        
        if (!urlId) {
            badge.innerHTML = '❌ NO ID';
            showError('Add ?id=ChannelName to URL (e.g., ?id=ZeeTv)');
            showLoader(false);
            forceControlsVisible();
            return;
        }
        
        await loadChannelById(urlId);
    }
    
    bootstrap();
</script>
</body>
</html>
